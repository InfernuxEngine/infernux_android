# Platform binaries are published together by the owning engine release workflow:
# ChenlizheMe/Infernux/.github/workflows/engine-platform-plugins.yml
name: Platform Plugin Source Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test standalone package construction
        run: python -m unittest discover -s tests -p test_release.py -v
